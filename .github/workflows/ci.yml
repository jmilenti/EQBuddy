name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build solution (WPF + Avalonia + Core + tests)
        run: dotnet build EQBuddy.slnx -c Release

      - name: Run tests
        run: dotnet test tests/EQBuddy.Tests/EQBuddy.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # Renders the Avalonia widget headlessly — no display server needed. Avalonia is not
      # shipped (EQdps is the WPF app), but it is still in the solution, so this keeps it
      # from rotting silently.
      - name: Run Avalonia render tests
        run: dotnet test tests/EQBuddy.Avalonia.Tests/EQBuddy.Avalonia.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

